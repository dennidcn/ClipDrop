[package]
name = "clipdrop"
version = "0.1.0"
description = "Copy a link, get the video. Downloads X/Twitter, Instagram and TikTok videos from your clipboard."
authors = ["Amar McCann"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "clipdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
arboard = { version = "3", default-features = false }
ureq = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
