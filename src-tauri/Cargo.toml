[package]
name = "clipdrop"
version = "0.3.0"
description = "Paste a link to save X/Twitter, Instagram and TikTok videos, or YouTube audio as MP3."
authors = ["Amar McCann"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "clipdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = "2"
sha2 = "0.10"
dunce = "1"
tauri-plugin-updater = "2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
